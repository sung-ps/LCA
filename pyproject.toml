[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bc1-kettle-lca"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.scripts]
kettle-lca = "lca_tool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
